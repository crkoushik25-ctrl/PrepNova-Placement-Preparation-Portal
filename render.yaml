services:
  - type: web
    name: prepnova-portal
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --pythonpath protal protal.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
