services:
  - type: web
    name: prepnova-portal
    env: python
    rootDir: protal
    buildCommand: "./build.sh"
    startCommand: "gunicorn protal.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
